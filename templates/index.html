<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keystroke Logger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Keystrokes Captured</h1>
    <table>
        <thead>
            <tr>
                <th>Keystroke</th>
                <th>Timestamp</th>
                <th>Client IP</th>
            </tr>
        </thead>
        <tbody>
            {% for keystroke, timestamp, client_ip in keystrokes %}
            <tr>
                <td>{{ keystroke }}</td>
                <td>{{ timestamp }}</td>
                <td>{{ client_ip }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
